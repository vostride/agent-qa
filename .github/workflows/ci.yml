name: CI

# Verifies pushes to main, pull requests into main and each release before it publishes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Only a newer pull request push supersedes a run; push and release runs each get their own group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      - name: Build
        run: pnpm build

      # A turbo cache hit skips prebuild, so the keyless stub is written here.
      - name: Pack the build
        run: |
          node packages/analytics/scripts/ensure-posthog-project.cjs
          tar -czf "$RUNNER_TEMP/build.tgz" packages/*/dist packages/analytics/src/posthog-project.ts

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/build.tgz
          archive: false
          retention-days: 3
          if-no-files-found: error

  workspace:
    name: Full workspace (ubuntu, ${{ matrix.node }}, ${{ matrix.leg.group }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [toolchain, floor]
        leg:
          - group: cli-1
            filter: --filter=agent-qa
            vitest: -- --shard=1/3
          - group: cli-2
            filter: --filter=agent-qa
            vitest: -- --shard=2/3
          - group: cli-3
            filter: --filter=agent-qa
            vitest: -- --shard=3/3
          - group: knowledge-local-1
            filter: --filter=@vostride/agent-qa-knowledge-local
            vitest: -- --shard=1/2
          - group: knowledge-local-2
            filter: --filter=@vostride/agent-qa-knowledge-local
            vitest: -- --shard=2/2
          - group: web
            filter: --filter=@vostride/agent-qa-web
          - group: dashboard-ui
            filter: --filter=@vostride/agent-qa-dashboard-ui
          - group: eval-local-dashboard
            filter: --filter=@vostride/agent-qa-eval-local --filter=@vostride/agent-qa-dashboard
          - group: agent-local-runner
            filter: --filter=@vostride/agent-qa-agent-local --filter=@vostride/agent-qa-runner
          - group: agent-eval-mcp
            filter: --filter=@vostride/agent-qa-agent --filter=@vostride/agent-qa-eval --filter=@vostride/agent-qa-mcp
          - group: rest
            filter: --filter=!agent-qa --filter=!@vostride/agent-qa-knowledge-local --filter=!@vostride/agent-qa-web --filter=!@vostride/agent-qa-dashboard-ui --filter=!@vostride/agent-qa-eval-local --filter=!@vostride/agent-qa-dashboard --filter=!@vostride/agent-qa-agent-local --filter=!@vostride/agent-qa-runner --filter=!@vostride/agent-qa-agent --filter=!@vostride/agent-qa-eval --filter=!@vostride/agent-qa-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The floor is the major of engines.node, never a version written here.
      - name: Read the Node floor
        id: floor
        if: matrix.node == 'floor'
        run: |
          major="$(jq -r '.engines.node' package.json | sed -nE 's/^>=([0-9]+)$/\1/p')"
          test -n "$major" || { echo "::error::engines.node must read >=<major>"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: matrix.node == 'toolchain'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Node at the floor
        if: matrix.node == 'floor'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.floor.outputs.major }}
          check-latest: true
          cache: pnpm

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tgz
          path: ${{ runner.temp }}

      # Extraction time keeps dist newer than the checked-out sources.
      - name: Unpack the build
        run: tar -xzmf "$RUNNER_TEMP/build.tgz"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/cli/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter agent-qa exec playwright-core install --with-deps chromium

      # Tests the downloaded build, one package at a time so its vitest pool owns the runner.
      - name: Test
        env:
          TURBO_CONCURRENCY: '1'
        run: pnpm exec turbo test ${{ matrix.leg.filter }} --only --continue ${{ matrix.leg.vitest }}

  checks:
    name: Typecheck and validators (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tgz
          path: ${{ runner.temp }}

      # Extraction time keeps dist newer than the checked-out sources.
      - name: Unpack the build
        run: tar -xzmf "$RUNNER_TEMP/build.tgz"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec turbo typecheck --only

      - name: Validate skills
        run: pnpm run validate:skills

      - name: Validate agent instructions
        run: pnpm run validate:agents

      - name: Validate publish surface
        run: pnpm run validate:publish

      - name: Test the root scripts
        run: pnpm run test:scripts

      # Holds even if a matrix edit stops the rest leg from reaching packages/arch.
      - name: Check CI matrix coverage
        run: node scripts/check-ci-matrix.mjs

  knip:
    name: Unused code report (knip)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tgz
          path: ${{ runner.temp }}

      # Extraction time keeps dist newer than the checked-out sources.
      - name: Unpack the build
        run: tar -xzmf "$RUNNER_TEMP/build.tgz"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The report never fails the job.
      - name: Report unused code
        continue-on-error: true
        run: pnpm exec knip

  mcp-conformance:
    name: MCP conformance (ubuntu, ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build

    # Generous: a short suite plus an npm fetch, on a runner that may be cold.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [toolchain, floor]

    # Its own job, so a conformance regression names itself; the tool's exit code gates, no score.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The floor is the major of engines.node, never a version written here.
      - name: Read the Node floor
        id: floor
        if: matrix.node == 'floor'
        run: |
          major="$(jq -r '.engines.node' package.json | sed -nE 's/^>=([0-9]+)$/\1/p')"
          test -n "$major" || { echo "::error::engines.node must read >=<major>"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: matrix.node == 'toolchain'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Node at the floor
        if: matrix.node == 'floor'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.floor.outputs.major }}
          check-latest: true
          cache: pnpm

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tgz
          path: ${{ runner.temp }}

      # Extraction time keeps dist newer than the checked-out sources.
      - name: Unpack the build
        run: tar -xzmf "$RUNNER_TEMP/build.tgz"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves on this platform, before the gate runs, that each of its guards can fail.
      - name: Conformance runner self-test
        run: bash scripts/mcp-conformance.sh --selftest --no-build

      # Measures the downloaded build of packages/cli/dist/cli.js.
      - name: MCP conformance
        run: bash scripts/mcp-conformance.sh --no-build

  ps-hosts:
    name: ps-host legs (macos, ${{ matrix.leg.group }})
    runs-on: macos-latest
    needs: build
    timeout-minutes: 40

    # macOS legs for suites that skip on Linux, where `resolveProcessIncarnation` reads /proc.
    strategy:
      fail-fast: false
      matrix:
        leg:
          - group: knowledge-local
            filter: --filter=@vostride/agent-qa-knowledge-local
          - group: cli-1
            filter: --filter=agent-qa
            vitest: -- --shard=1/3
          - group: cli-2
            filter: --filter=agent-qa
            vitest: -- --shard=2/3
          - group: cli-3
            filter: --filter=agent-qa
            vitest: -- --shard=3/3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tgz
          path: ${{ runner.temp }}

      # Extraction time keeps dist newer than the checked-out sources.
      - name: Unpack the build
        run: tar -xzmf "$RUNNER_TEMP/build.tgz"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/cli/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter agent-qa exec playwright-core install --with-deps chromium

      # Tests the downloaded build, one package at a time so its vitest pool owns the runner.
      - name: Test daemon and lease packages
        env:
          TURBO_CONCURRENCY: '1'
        run: pnpm exec turbo test ${{ matrix.leg.filter }} --only --continue ${{ matrix.leg.vitest }}

      - name: Typecheck daemon and lease packages
        if: matrix.leg.group == 'knowledge-local'
        run: >-
          pnpm exec turbo typecheck
          --filter=@vostride/agent-qa-knowledge-local
          --filter=agent-qa
          --only

  audit:
    name: Dependency audit report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The report never fails the job; release keeps the failing gate.
      - name: Report production advisories
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee "$RUNNER_TEMP/audit.txt"

      - name: Write the report to the step summary
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/audit.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # A broken image fails the pull request, not a release after npm has published.
  images:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [web, android]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: false
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}

  # main's branch protection requires this check by name.
  ci-result:
    name: CI result
    if: always()
    needs: [build, workspace, checks, knip, audit, mcp-conformance, ps-hosts, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = Object.entries(JSON.parse(process.env.RESULTS))
            for (const [job, need] of needs) console.log(`${job}: ${need.result}`)
            if (needs.length === 0 || needs.some(([, need]) => need.result !== "success")) process.exit(1)
          '
