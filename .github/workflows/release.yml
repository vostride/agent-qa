name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        type: choice
        options:
          - patch
          - minor
      subscription_auth_target_version:
        description: Existing agent-qa version to publish only subscription-auth for; leave blank for a full release
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm packages
    if: ${{ inputs.subscription_auth_target_version == '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: pnpm exec node scripts/release/verify.mjs --bump "${{ inputs.bump }}" --stage preflight

      - name: Write release version
        id: version
        run: pnpm exec node scripts/release/version.mjs --bump "${{ inputs.bump }}" --write

      - name: Write PostHog project key
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: pnpm exec node scripts/release/posthog.mjs --write

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate skills
        run: pnpm run validate:skills

      - name: Validate agent instructions
        run: pnpm run validate:agents

      - name: Validate publish surface
        run: pnpm run validate:publish

      - name: Stage packages
        run: pnpm exec node scripts/release/stage-packages.mjs --target-version "${{ steps.version.outputs.version }}" --out .release/staged-packages

      - name: Release postbuild verification
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: pnpm exec node scripts/release/verify.mjs --bump "${{ inputs.bump }}" --stage postbuild --target-version "${{ steps.version.outputs.version }}" --staged-dir .release/staged-packages

      - name: Create release commit and tag
        run: pnpm exec node scripts/release/git.mjs --commit-tag

      - name: Push release commit and tag
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Publish packages
        run: pnpm exec node scripts/release/publish.mjs --staged-dir .release/staged-packages

  subscription-auth:
    name: Publish subscription auth
    needs: npm
    if: ${{ always() && (inputs.subscription_auth_target_version != '' || needs.npm.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      SUBSCRIPTION_AUTH_TARGET_VERSION: ${{ inputs.subscription_auth_target_version || needs.npm.outputs.version }}

    steps:
      - name: Validate subscription auth release token
        env:
          SUBSCRIPTION_AUTH_RELEASE_TOKEN: ${{ secrets.SUBSCRIPTION_AUTH_RELEASE_TOKEN }}
        run: |
          if [ -z "$SUBSCRIPTION_AUTH_RELEASE_TOKEN" ]; then
            echo "::error::Set SUBSCRIPTION_AUTH_RELEASE_TOKEN in the vostride/agent-qa repository Actions secrets. The token needs Contents: read and write on vostride/agent-qa-subscription-auth."
            exit 1
          fi

      - name: Checkout agent-qa for linked core dependency
        uses: actions/checkout@v6
        with:
          path: agent-qa
          ref: ${{ github.ref_name }}

      - name: Checkout subscription auth
        uses: actions/checkout@v6
        with:
          repository: vostride/agent-qa-subscription-auth
          path: agent-qa-subscription-auth
          token: ${{ secrets.SUBSCRIPTION_AUTH_RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install agent-qa dependencies
        working-directory: agent-qa
        run: pnpm install --frozen-lockfile

      - name: Build linked ID helpers
        working-directory: agent-qa
        run: pnpm --filter @vostride/agent-qa-ids build

      - name: Build linked core dependency
        working-directory: agent-qa
        run: pnpm --filter @vostride/agent-qa-core build

      - name: Install dependencies
        working-directory: agent-qa-subscription-auth
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        working-directory: agent-qa-subscription-auth
        run: pnpm run release:verify -- --target-version "$SUBSCRIPTION_AUTH_TARGET_VERSION" --stage preflight

      - name: Write release version
        working-directory: agent-qa-subscription-auth
        run: pnpm run release:version -- --target-version "$SUBSCRIPTION_AUTH_TARGET_VERSION" --write

      - name: Test
        working-directory: agent-qa-subscription-auth
        run: pnpm test

      - name: Typecheck
        working-directory: agent-qa-subscription-auth
        run: pnpm typecheck

      - name: Build
        working-directory: agent-qa-subscription-auth
        run: pnpm build

      - name: Stage package
        working-directory: agent-qa-subscription-auth
        run: pnpm run release:stage -- --target-version "$SUBSCRIPTION_AUTH_TARGET_VERSION" --out .release/package

      - name: Release postbuild verification
        working-directory: agent-qa-subscription-auth
        run: pnpm run release:verify -- --stage postbuild --target-version "$SUBSCRIPTION_AUTH_TARGET_VERSION" --staged-dir .release/package

      - name: Create release commit and tag
        working-directory: agent-qa-subscription-auth
        run: pnpm exec node scripts/release/git.mjs --commit-tag

      - name: Push release commit and tag
        working-directory: agent-qa-subscription-auth
        run: git push origin HEAD:main --follow-tags

      - name: Publish package
        working-directory: agent-qa-subscription-auth
        run: pnpm run release:publish -- --staged-dir .release/package

  docker:
    name: Publish Docker images
    if: ${{ inputs.subscription_auth_target_version == '' }}
    needs:
      - npm
      - subscription-auth
    uses: ./.github/workflows/docker-release.yml
    with:
      ref: v${{ needs.npm.outputs.version }}
      move_latest: true
    secrets: inherit
