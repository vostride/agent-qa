name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
      npm_target_version:
        description: Existing agent-qa version to finish publishing from its tag; leave blank for a full release. Dispatch it on the tag, so npm provenance names the commit it publishes, with gh workflow run release.yml --ref v<version> -f npm_target_version=<version>. It publishes what npm lacks, subscription auth only if npm lacks it, then Docker and the GitHub release.
        required: false
        type: string
      subscription_auth_target_version:
        description: Existing agent-qa version to publish only subscription-auth for; leave blank for a full release
        required: false
        type: string
      github_release_target_version:
        description: Existing agent-qa version to publish only the GitHub Release for; leave blank for a full release
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: ${{ inputs.npm_target_version == '' && inputs.subscription_auth_target_version == '' && inputs.github_release_target_version == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  npm:
    name: Publish npm packages
    needs: ci
    if: ${{ !cancelled() && inputs.subscription_auth_target_version == '' && inputs.github_release_target_version == '' && (needs.ci.result == 'success' || (inputs.npm_target_version != '' && needs.ci.result == 'skipped')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version || steps.resume.outputs.version }}
      subscription_auth_on_npm: ${{ steps.resume.outputs.subscription_auth_on_npm }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release push token
        if: ${{ inputs.npm_target_version == '' }}
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "::error::Set RELEASE_PUSH_TOKEN in the vostride/agent-qa repository Actions secrets. The token needs Contents: read and write on vostride/agent-qa, and its owner must be allowed to bypass the main branch protection."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resume preflight
        id: resume
        if: ${{ inputs.npm_target_version != '' }}
        env:
          NPM_TARGET_VERSION: ${{ inputs.npm_target_version }}
        run: pnpm exec node scripts/release/verify.mjs --stage resume --target-version "$NPM_TARGET_VERSION"

      - name: Audit dependencies (fail on high)
        if: ${{ inputs.npm_target_version == '' }}
        run: pnpm audit --prod --audit-level high

      - name: Release preflight
        if: ${{ inputs.npm_target_version == '' }}
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: pnpm exec node scripts/release/verify.mjs --bump "${{ inputs.bump }}" --stage preflight

      - name: Write release version
        id: version
        if: ${{ inputs.npm_target_version == '' }}
        run: pnpm exec node scripts/release/version.mjs --bump "${{ inputs.bump }}" --write

      - name: Write PostHog project key
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: pnpm exec node scripts/release/posthog.mjs --write

      # The key file is gitignored, so turbo does not hash it and would restore a keyless cached dist.
      - name: Build
        run: pnpm exec turbo build --force

      - name: Validate skills
        run: pnpm run validate:skills

      - name: Validate agent instructions
        run: pnpm run validate:agents

      - name: Validate publish surface
        run: pnpm run validate:publish

      - name: Stage packages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version || steps.resume.outputs.version }}
        run: pnpm exec node scripts/release/stage-packages.mjs --target-version "$RELEASE_VERSION" --out .release/staged-packages

      - name: Release postbuild verification
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version || steps.resume.outputs.version }}
        run: pnpm exec node scripts/release/verify.mjs --bump "${{ inputs.bump }}" --stage postbuild --target-version "$RELEASE_VERSION" --staged-dir .release/staged-packages

      - name: Create release commit and tag
        if: ${{ inputs.npm_target_version == '' }}
        run: pnpm exec node scripts/release/git.mjs --commit-tag

      # The commit and tag land together or not at all.
      - name: Push release commit and tag
        if: ${{ inputs.npm_target_version == '' }}
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version || steps.resume.outputs.version }}
        run: |
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$RELEASE_PUSH_TOKEN"; }; f' push --atomic https://github.com/${{ github.repository }}.git HEAD:refs/heads/${{ github.ref_name }} "refs/tags/v$RELEASE_VERSION"

      - name: Publish packages
        run: pnpm exec node scripts/release/publish.mjs --staged-dir .release/staged-packages

  subscription-auth:
    name: Publish subscription auth
    needs: npm
    if: ${{ always() && inputs.github_release_target_version == '' && (inputs.subscription_auth_target_version != '' || (needs.npm.result == 'success' && needs.npm.outputs.subscription_auth_on_npm != 'true')) }}
    runs-on: ubuntu-latest
    env:
      SUBSCRIPTION_AUTH_TARGET_VERSION: ${{ inputs.subscription_auth_target_version || needs.npm.outputs.version }}

    steps:
      - name: Validate subscription auth release token
        env:
          SUBSCRIPTION_AUTH_RELEASE_TOKEN: ${{ secrets.SUBSCRIPTION_AUTH_RELEASE_TOKEN }}
        run: |
          if [ -z "$SUBSCRIPTION_AUTH_RELEASE_TOKEN" ]; then
            echo "::error::Set SUBSCRIPTION_AUTH_RELEASE_TOKEN in the vostride/agent-qa repository Actions secrets. The token needs Actions: read and write on vostride/agent-qa-subscription-auth."
            exit 1
          fi

      - name: Dispatch subscription auth release
        env:
          GH_TOKEN: ${{ secrets.SUBSCRIPTION_AUTH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          started_at="$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release.yml \
            --repo vostride/agent-qa-subscription-auth \
            --ref main \
            -f target_version="$SUBSCRIPTION_AUTH_TARGET_VERSION"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(gh run list \
              --repo vostride/agent-qa-subscription-auth \
              --workflow release.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle,createdAt \
              --jq '.[] | select(.displayTitle == "Release subscription auth '"$SUBSCRIPTION_AUTH_TARGET_VERSION"'") | select(.createdAt >= "'"$started_at"'") | .databaseId' \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Timed out waiting for subscription-auth release workflow to start."
            exit 1
          fi

          gh run watch "$run_id" \
            --repo vostride/agent-qa-subscription-auth \
            --exit-status \
            --interval 10

  docker:
    name: Publish Docker images
    if: ${{ !cancelled() && inputs.subscription_auth_target_version == '' && inputs.github_release_target_version == '' && needs.npm.result == 'success' && (needs.subscription-auth.result == 'success' || (needs.subscription-auth.result == 'skipped' && needs.npm.outputs.subscription_auth_on_npm == 'true')) }}
    needs:
      - npm
      - subscription-auth
    uses: ./.github/workflows/docker-release.yml
    with:
      ref: v${{ needs.npm.outputs.version }}
      move_latest: true
    secrets: inherit

  github-release:
    name: Publish GitHub release
    if: ${{ always() && (inputs.github_release_target_version != '' || (inputs.subscription_auth_target_version == '' && needs.npm.result == 'success' && (needs.subscription-auth.result == 'success' || (needs.subscription-auth.result == 'skipped' && needs.npm.outputs.subscription_auth_on_npm == 'true')))) }}
    needs:
      - npm
      - subscription-auth
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.github_release_target_version || needs.npm.outputs.version }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RELEASE_TARGET_VERSION: ${{ inputs.github_release_target_version || needs.npm.outputs.version }}
        run: node scripts/release/github-release.mjs --version "$GITHUB_RELEASE_TARGET_VERSION" --repo "${{ github.repository }}"
