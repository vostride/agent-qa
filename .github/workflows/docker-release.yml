name: Docker Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build. Defaults to the selected workflow ref.
        required: false
        type: string
        default: ''
      move_latest:
        description: Move latest tags after all immutable image pushes succeed
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      move_latest:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: docker-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Docker release preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.docker.outputs.version }}
      namespace: ${{ steps.docker.outputs.namespace }}
      images: ${{ steps.docker.outputs.images }}
      build: ${{ steps.docker.outputs.build }}
      retag: ${{ steps.docker.outputs.retag }}
      node_version: ${{ steps.docker.outputs.node_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker release plan
        id: docker
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: pnpm exec node scripts/release/docker.mjs --check-tags --require-env --github-output

  docker:
    name: Build and push ${{ matrix.image.id }}
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.build != '[]' }}
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJson(needs.preflight.outputs.build) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image.image }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=v${{ needs.preflight.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: ${{ matrix.image.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.image.buildArgs }}
          provenance: mode=max
          sbom: true

  retag:
    name: Add missing version tag for ${{ matrix.retag.image }}
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.retag != '[]' }}
    strategy:
      fail-fast: true
      matrix:
        retag: ${{ fromJson(needs.preflight.outputs.retag) }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Add missing version tag
        run: docker buildx imagetools create -t "${{ matrix.retag.image }}:${{ matrix.retag.missing }}" "${{ matrix.retag.image }}:${{ matrix.retag.present }}"

  latest:
    name: Move latest tag for ${{ matrix.image.id }}
    if: ${{ !cancelled() && inputs.move_latest && needs.preflight.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.docker.result) && contains(fromJSON('["success","skipped"]'), needs.retag.result) }}
    runs-on: ubuntu-latest
    needs: [preflight, docker, retag]
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJson(needs.preflight.outputs.images) }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Move latest tag
        run: docker buildx imagetools create -t "${{ matrix.image.image }}:latest" "${{ matrix.image.image }}:${{ needs.preflight.outputs.version }}"
