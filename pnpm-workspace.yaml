packages:
  - "packages/*"
  - "plugins/*"

allowBuilds:
  # @appium/coresim and appium-ios-tuntap load a prebuilt binary at run time; neither script needs to run
  '@appium/coresim': false
  # The sentry-cli binary comes from its platform package, so its install script never runs
  '@sentry/cli': false
  appium-ios-tuntap: false
  edgedriver: false
  geckodriver: false
  onnxruntime-node: false
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
  # Adopted inside pnpm's one-day release age; a fresh frozen install refuses it without this
  - id-agent@1.2.0

overrides:
  # WebdriverIO's config pins a glob line with a moderate advisory
  "@wdio/config>glob": 14.0.3
  # monaco-editor pins dompurify exactly, and that version has a critical and a high advisory
  monaco-editor>dompurify: 3.4.17
  # archiver's readdir-glob pins a minimatch line with a moderate advisory
  readdir-glob>minimatch: 11.0.3
