# agent-qa Demo Project
workspace:
  testMatch:
    - tests/web/**/*.yaml
    - tests/mobile/**/*.yaml
    - tests/farm/**/*.yaml
  suiteMatch:
    - suites/**/*.suite.yaml
  hooksFile: hooks.yaml
  agentRules: ./agent-rules.md
  envFile: .env
  secretsFile: .env.secrets.local
services:
  cache:
    dir: .agent-qa/cache
    ttl: 7d
  memory:
    dir: agent-qa-memory
use:
  mobile:
    appState: preserve
