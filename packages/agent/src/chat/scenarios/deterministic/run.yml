# The `run <test-ref>` alias. The reference is handed to the run-start op as a pattern,
# verbatim: the table binds what the person typed and the op resolves it.
id: run
class: deterministic
lane: hermetic
utterance: run tests/checkout.spec.ts
expect:
  kind: should_execute
  executed: 1
  ops:
    - runs.start
  argsPin:
    patterns:
      - tests/checkout.spec.ts
