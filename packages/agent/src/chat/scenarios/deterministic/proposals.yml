# `proposals` is not an alias: changes apply in the call, so there is no inbox for the word to route
# to. Stage 1 does not resolve it, so it is an ordinary clause that goes to the planner; the
# hermetic lane's tripwire planner cannot route it, and the turn refuses, naming the clause, with
# zero executions.
id: proposals
class: deterministic
lane: hermetic
utterance: proposals
expect:
  kind: fail_closed
  executed: 0
  namesClause: proposals
  emitsSessionEvent: mark_unhandled
