# the subject was `proposals.list`, deleted with the inbox; `quarantine.list`
# is the same kind of op — read-only, empty input, an empty listing on a fresh project.
id: fn
class: deterministic
lane: hermetic
utterance: /fn quarantine.list
expect:
  kind: should_execute
  executed: 1
  ops:
    - quarantine.list
