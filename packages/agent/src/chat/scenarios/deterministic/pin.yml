# `/pin` is not a directive or an alias. Stage 1 does not resolve it, so it is an ordinary clause
# that goes to the planner; the hermetic lane's tripwire planner cannot route it, and the turn
# refuses, naming the clause, with zero executions and no `approval_decision` row.
id: pin
class: deterministic
lane: hermetic
utterance: /pin proposals.accept
expect:
  kind: fail_closed
  executed: 0
  namesClause: /pin proposals.accept
  emitsSessionEvent: mark_unhandled
