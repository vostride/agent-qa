# An unroutable `/pin` clause plus a write-test clause. `/pin` is not a directive, so stage 1
# resolves neither; both go to the planner, the hermetic lane's tripwire planner cannot route them,
# and the turn refuses whole, naming the `/pin` clause, with zero executions.
#
# The runner asserts the events a refused turn must not leave (no `approval_decision`, no
# verb-sourced `model_change`), not only `executed == 0`. No turn writes an approval row.
#
# Hermetic, and the exception is named in `scenario-manifest.test.ts`.
id: pin-and-write-test
class: compound
lane: hermetic
utterance: /pin fn:runs.start and write a test for 2FA
expect:
  kind: fail_closed
  executed: 0
  namesClause: /pin fn:runs.start
  emitsSessionEvent: mark_unhandled
