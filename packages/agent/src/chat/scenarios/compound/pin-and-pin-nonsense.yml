# Two `/pin` clauses in one turn. `/pin` is not a directive, so neither clause resolves at stage 1;
# both go to the planner, the hermetic lane's tripwire planner cannot route them, and the turn
# refuses whole, naming the first clause, with zero executions and no `approval_decision` row.
#
# The runner's fail_closed side-effect assertion (no `approval_decision`, no verb-sourced
# `model_change`, no executed receipt) runs over this multi-clause refusal. The batch arm of
# directive side effects is carried by the `/model` directive cells in
# `turn-engine-compound.test.ts`.
#
# Hermetic, and the exception is named in `scenario-manifest.test.ts` rather than derived from the
# class. `fail_closed`, so the `should_execute` denominators do not move.
id: pin-and-pin-nonsense
class: compound
lane: hermetic
utterance: /pin fn:runs.start and /pin nonsense.notacapability
expect:
  kind: fail_closed
  executed: 0
  namesClause: /pin fn:runs.start
  emitsSessionEvent: mark_unhandled
